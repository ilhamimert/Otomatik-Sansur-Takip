ai:
  verifier_mode: none
categories:
  alcohol: true
  blood: true
  child_face: false
  cigarette: true
  drug: true
  nudity: true
  private_plate: false
  weapon: true
export:
  blur_intensity: high
  codec_priority:
  - avc1
  - mp4v
  - XVID
model:
  onnx_path: models/yolo11n.onnx
  openvino_path: models/yolo11n_openvino_model
  path: models/yolo11n.pt
  prefer_openvino: true
scan:
  confidence_threshold: 0.5
  confirm_window: 3
  cpu_sleep_ms: 0
  frame_skip: 5
  motion_threshold: 800
ui:
  language: tr
  theme: dark
service:
  watch_dir: ""          # boş bırakırsan proje yanında WatchFolder/ oluşturulur
  max_workers: 2         # aynı anda kaç video paralel taransın

api:
  host: "0.0.0.0"
  port: 8000
  api_key: ""            # boş bırakırsan auth devre dışı; doldurunca Bearer token zorunlu olur
